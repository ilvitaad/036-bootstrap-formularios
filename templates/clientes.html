{% extends "base.html" %}

{% block title %}Clientes{% endblock %} 

{% block contenido %}

<h1>Registro de Clientes</h1>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <!-- Nombre -->
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text"
                       name="nombre"
                       class="form-control"
                       required>
            </div>

            <!-- NIT -->
            <div class="mb-3">
                <label class="form-label">NIT</label>
                <input type="text"
                       name="nit"
                       class="form-control"
                       required>
            </div>

            <!-- Correo -->
            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email"
                       name="correo"
                       class="form-control"
                       required>
            </div>

            <!-- Teléfono -->
            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text"
                       name="telefono"
                       class="form-control"
                       required>
            </div>

            <!-- Dirección -->
            <div class="mb-3">
                <label class="form-label">Dirección</label>
                <input type="text"
                       name="direccion"
                       class="form-control"
                       required>
            </div>

            <!-- Botón -->
            <button type="submit"
                    class="btn btn-primary">
                Registrar cliente
            </button>
        </form>
    </div>
</div>
{% endblock %}
